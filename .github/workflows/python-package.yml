# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest setuptools mongomock
        # Remove this source pin after Kahi_impactu_type_catalog 0.1.0 is on PyPI.
        pip install "Kahi-impactu-type-catalog @ git+https://github.com/fedevergara/Kahi_plugins.git@330d466c91766556f48509d79484de7bfb20da8a#subdirectory=Kahi_impactu_type_catalog"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --ignore=C901 --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --ignore=C901 --exit-zero --max-complexity=10 --max-line-length=200 --statistics
    - name: Test with pytest
      run: |
        python setup.py develop --user
        pytest -q
